[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "predict",
    "quantam",
    "quagent",
    "fastapi>=0.136.1",
    "uvicorn>=0.47.0",
    "rich>=15.0.0",
    "google>=3.0.0",
    "redis>=8.0.0",
    "python-dotenv>=1.2.2",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "fakeredis>=2.35.1",
    "pytest-mock>=3.15.1",
    "sqlalchemy>=2.0.50",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "alembic>=1.18.4",
    "tzdata>=2026.2",
]

[dependency-groups]
dev = [
    "aiohttp>=3.13.5",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.workspace]
members = [
    "packages/predict_all",
    "packages/quantam_trade",
    "packages/quantam_agent",
]

[tool.uv.sources]
predict = {workspace = true}
quantam = {workspace = true}
quagent = {workspace = true}

