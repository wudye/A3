# Redis 配置文件
# 绑定地址（0.0.0.0 允许外部连接）
bind 0.0.0.0

# 端口
port 6379

# 密码（也可以通过命令行参数设置）
# requirepass your-password-here

# 持久化配置
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# 内存管理
maxmemory 256mb
maxmemory-policy allkeys-lru

# 日志
loglevel notice
logfile ""

# 数据库数量
databases 16

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 通知（可选）
notify-keyspace-events Ex
